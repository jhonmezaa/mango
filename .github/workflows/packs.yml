# MCP packs (D19): build each pack reproducibly, audit it, compare its tools/list with the
# manifest and sign it. Nothing is deployed or published to a customer account from here.
#
# The `build` job runs third-party code (the upstream MCP server), so it has no secrets and
# no AWS access, and that code runs in a container without network (`docker --network none`). The `sign` job has the signing role but never runs pack code and signs
# nothing that code could have touched: it builds the zip and the statement again from the
# commit, requires the zip to be byte for byte the one `build` tested, and only then assumes
# the role and asks KMS for the signature.
#
# The repository is public, and so are these logs and artifacts (D59). The ARN of the signing
# role is a secret of the `pack-signing` environment, which the runner masks, never a
# repository variable, which it prints. The key is named by its alias, because the envelope
# records the key id and is uploaded as an artifact, where nothing is masked.
# `PACK_SIGNING_ENABLED` is a variable because a job `if:` cannot read secrets; it carries no
# data.
#
# A push to main asks the owner to approve one signature per pack, so it only starts for what
# can change a byte of a zip or of a signed statement. `mise.toml` and `uv.lock` are not in
# that list: the part of them that reaches a pack (the Python and uv that write the zip, the
# packages that write the statement) is recorded in `deployment/pack-builder/toolchain.toml`,
# which a test keeps equal to both files, so raising one of those versions changes a file
# that is in the list. A pull request never signs and keeps both files: it builds.
#
# Remote MCP profiles (`remotes/<id>/`, D98 (14)) are signed the same way, with the same key
# and environment. They have no code to build or run: `remote-build` checks the profile and
# its tool schema offline and writes the statement; `remote-sign` writes it again from the
# commit, requires it to be byte for byte the checked one, and only then signs.
name: packs

on:
  pull_request:
    paths:
      - packs/**
      - remotes/**
      - deployment/build-pack.sh
      - deployment/pack-builder/**
      - packages/py/mango-packs/**
      # Copied into the zip of packs over account data (their common entry point, D37).
      - packages/py/mango-pack-runtime/**
      - packages/py/mango-aws/**
      - .github/workflows/packs.yml
      - mise.toml
      - uv.lock
  push:
    branches: [main]
    paths:
      - packs/**
      - remotes/**
      - deployment/build-pack.sh
      - deployment/pack-builder/**
      - packages/py/mango-packs/**
      # Copied into the zip of packs over account data (their common entry point, D37).
      - packages/py/mango-pack-runtime/**
      - packages/py/mango-aws/**
      - .github/workflows/packs.yml

permissions:
  contents: read

concurrency:
  group: packs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.pack }}
    # arm64 is the platform of AgentCore Runtime: the tools snapshot runs the built zip itself,
    # in a container without network (deployment/build-pack.sh).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pack: [aws-pricing, aws-billing, aws-cloudwatch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: python uv
      - run: deployment/build-pack.sh "packs/$PACK" dist/packs
        env:
          PACK: ${{ matrix.pack }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pack-${{ matrix.pack }}
          path: dist/packs/
          if-no-files-found: error
          retention-days: 30

  sign:
    name: Sign ${{ matrix.pack }}
    needs: build
    # Only what is merged to main is signed, and only once the provider key exists (U10).
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.PACK_SIGNING_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    # Protected environment: only `main` can deploy to it, and it is the only place the role
    # trusts. It must carry a required reviewer (D59; see packs/README.md).
    environment: pack-signing
    permissions:
      contents: read
      id-token: write # OIDC to assume the signing role; no long-lived AWS keys
    strategy:
      fail-fast: false
      matrix:
        pack: [aws-pricing, aws-billing, aws-cloudwatch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: python uv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pack-${{ matrix.pack }}
          path: tested
      - name: Rebuild and compare with the tested zip
        env:
          PACK: ${{ matrix.pack }}
        run: |
          set -euo pipefail
          tested="$(find tested -maxdepth 1 -name '*.zip')"
          deployment/build-pack.sh "packs/$PACK" dist/packs "$tested"
      # The runner masks the ARN of the role as it is; the account id alone (in an error of STS
      # or KMS, in another ARN of the account) is masked here, before anything can print it.
      - name: Require the signing configuration
        env:
          PACK_SIGNING_ROLE_ARN: ${{ secrets.PACK_SIGNING_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$PACK_SIGNING_ROLE_ARN" ]; then
            echo "::error::PACK_SIGNING_ENABLED is true but the pack-signing environment has no PACK_SIGNING_ROLE_ARN secret"
            exit 1
          fi
          IFS=: read -r _ _ _ _ account _ <<<"$PACK_SIGNING_ROLE_ARN"
          if [[ "$account" =~ ^[0-9]{12}$ ]]; then
            echo "::add-mask::$account"
          fi
      # Credentials come last: everything above ran without access to the signing key.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.PACK_SIGNING_ROLE_ARN }}
          aws-region: ${{ vars.PACK_SIGNING_REGION || 'us-east-1' }}
          role-session-name: mango-pack-signing
          role-duration-seconds: 900
          mask-aws-account-id: true
      # The public key is the one committed to the repository, the same one installations
      # trust: a signature made with any other key fails here and is never uploaded.
      - name: Sign and verify
        env:
          # The alias, never the ARN: this value ends up in the envelope (`signature.key_id`).
          PACK_SIGNING_KEY: alias/mango-provider-signing
        run: |
          set -euo pipefail
          statement="$(find dist/packs -maxdepth 1 -name '*.statement.json')"
          envelope="${statement%.statement.json}.pack.json"
          builder=(uv run --frozen --no-sync --package mango-pack-builder python -m mango_pack_builder)
          "${builder[@]}" sign --statement "$statement" --key-id "$PACK_SIGNING_KEY" \
            --public-key packs/signing-key.pub --out "$envelope"
          "${builder[@]}" verify --envelope "$envelope" --public-key packs/signing-key.pub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pack-${{ matrix.pack }}-signed
          path: dist/packs/
          if-no-files-found: error
          retention-days: 90

  remote-build:
    name: Check remote ${{ matrix.remote }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        remote: [azure-devops]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: python uv
      - name: Check and write the statement
        env:
          REMOTE: ${{ matrix.remote }}
        run: |
          set -euo pipefail
          builder=(uv --color never run --frozen --package mango-pack-builder python -m mango_pack_builder)
          "${builder[@]}" remote check "remotes/$REMOTE"
          "${builder[@]}" remote build "remotes/$REMOTE" --revision "$GITHUB_SHA" --out dist/remotes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-${{ matrix.remote }}
          path: dist/remotes/
          if-no-files-found: error
          retention-days: 30

  remote-sign:
    name: Sign remote ${{ matrix.remote }}
    needs: remote-build
    # Same rule as the packs: only main, only once the provider key exists.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.PACK_SIGNING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pack-signing
    permissions:
      contents: read
      id-token: write # OIDC to assume the signing role; no long-lived AWS keys
    strategy:
      fail-fast: false
      matrix:
        remote: [azure-devops]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: python uv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remote-${{ matrix.remote }}
          path: tested
      - name: Rewrite and compare with the checked statement
        env:
          REMOTE: ${{ matrix.remote }}
        run: |
          set -euo pipefail
          builder=(uv --color never run --frozen --package mango-pack-builder python -m mango_pack_builder)
          "${builder[@]}" remote build "remotes/$REMOTE" --revision "$GITHUB_SHA" --out dist/remotes
          statement="$(find dist/remotes -maxdepth 1 -name '*.statement.json')"
          cmp "$statement" "tested/$(basename "$statement")"
      - name: Require the signing configuration
        env:
          PACK_SIGNING_ROLE_ARN: ${{ secrets.PACK_SIGNING_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$PACK_SIGNING_ROLE_ARN" ]; then
            echo "::error::PACK_SIGNING_ENABLED is true but the pack-signing environment has no PACK_SIGNING_ROLE_ARN secret"
            exit 1
          fi
          IFS=: read -r _ _ _ _ account _ <<<"$PACK_SIGNING_ROLE_ARN"
          if [[ "$account" =~ ^[0-9]{12}$ ]]; then
            echo "::add-mask::$account"
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.PACK_SIGNING_ROLE_ARN }}
          aws-region: ${{ vars.PACK_SIGNING_REGION || 'us-east-1' }}
          role-session-name: mango-remote-signing
          role-duration-seconds: 900
          mask-aws-account-id: true
      - name: Sign and verify
        env:
          # The alias, never the ARN: this value ends up in the envelope (`signature.key_id`).
          PACK_SIGNING_KEY: alias/mango-provider-signing
        run: |
          set -euo pipefail
          statement="$(find dist/remotes -maxdepth 1 -name '*.statement.json')"
          envelope="${statement%.statement.json}.remote.json"
          builder=(uv run --frozen --no-sync --package mango-pack-builder python -m mango_pack_builder)
          "${builder[@]}" remote sign --statement "$statement" --key-id "$PACK_SIGNING_KEY" \
            --public-key packs/signing-key.pub --out "$envelope"
          "${builder[@]}" remote verify --envelope "$envelope" --public-key packs/signing-key.pub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-${{ matrix.remote }}-signed
          path: dist/remotes/
          if-no-files-found: error
          retention-days: 90
