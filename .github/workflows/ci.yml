# Continuous integration: the same gates as `mise run lint|typecheck|test|synth|guard|checkov|audit|secrets`.
# It only verifies; nothing is deployed from CI (D8, D9).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    # The suite reached 14 min on slow runners (2026-11-08): room before a cut, not a target.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  typescript:
    name: TypeScript (web, infra, cdk-nag, cfn-guard, checkov)
    runs-on: ubuntu-latest
    # Cut at 25 min on main and on PRs on slow runners (2026-11-08), with every test green.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run typecheck
      # The infra stacks embed the SPA build, so it is built before infra tests and synth.
      - run: pnpm --filter @mango/web build
      # And the runner of the second origin with the npm part of its mirror (D123). The Pyodide
      # packages are downloaded only by the release build.
      - run: pnpm --filter @mango/ui-sandbox build
      - run: pnpm -r --if-present run test
      # Browser flow (create, review, use an agent) against the local mock: no AWS, no secrets.
      - run: pnpm --filter @mango/web exec playwright install --with-deps chromium
      - run: pnpm --filter @mango/web run e2e
      # The runner in Chromium, served as CloudFront would, from another site: no AWS.
      - run: pnpm --filter @mango/ui-sandbox run build:e2e
      - run: pnpm --filter @mango/ui-sandbox run e2e
      # Synthesis runs cdk-nag (AwsSolutions); the templates carry no account, so it needs no AWS credentials.
      - run: pnpm --filter @mango/infra exec cdk synth --quiet
      - run: mise run guard
      - run: mise run checkov

  security:
    name: Security (dependencies, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: mise run audit
      - run: gitleaks git . --no-banner --redact
      # Not secrets, so gitleaks does not see them: account ids, organization ids, hosts and
      # mail addresses of a real installation, by their shape (D59).
      - run: python3 deployment/check-real-data.py
