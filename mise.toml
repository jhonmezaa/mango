# Tool versions and common tasks for the Mango monorepo (D12).
[tools]
python = "3.13.15"
node = "24.21.0"
uv = "0.12.19"
pnpm = "10.32.1"
"github:aws-cloudformation/cloudformation-guard" = "3.2.1"
"aqua:gitleaks/gitleaks" = "8.30.1"

[env]
UV_PYTHON = "3.13.15"

[tasks.install]
description = "Install Python and TypeScript dependencies"
run = ["uv sync --all-packages", "pnpm install --frozen-lockfile"]

[tasks.lint]
description = "Lint and format-check all code"
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "pnpm -r --if-present run lint",
]

[tasks.typecheck]
description = "Static type checks"
run = ["uv run mypy", "pnpm -r --if-present run typecheck"]

[tasks.test]
description = "Unit tests (no real AWS calls)"
run = ["uv run pytest", "pnpm -r --if-present run test"]

[tasks.e2e]
description = "Playwright: create, review and use an agent against the local mock (no AWS)"
run = [
  "pnpm --filter @mango/web exec playwright install chromium",
  "pnpm --filter @mango/web run e2e",
]

[tasks.install-check]
description = "Browser journeys against a real installation, read-only (MANGO_INSTALL_CONFIG=<file outside the repo>). MANGO_INSTALL_EFFECTS=chat,people or all adds the journeys with effect. See tests/install/README.md"
run = [
  "pnpm --filter @mango/install-check exec playwright install chromium",
  "pnpm --filter @mango/install-check run check",
]

[tasks.api-client]
description = "Regenerate packages/ts/api-client from the OpenAPI of mango-api (commit the result)"
run = [
  "uv run python -m mango_api.openapi packages/ts/api-client/openapi.json",
  "pnpm --filter @mango/api-client run generate",
]

[tasks.synth]
description = "Synthesize CDK stacks (runs cdk-nag)"
run = "pnpm --filter @mango/infra run synth"

[tasks.guard]
description = "Validate the synthesized templates with cfn-guard (run synth first)"
run = "cfn-guard validate -d infra/cdk.out/Core.template.json -d infra/cdk.out/PackNetwork.template.json -d infra/cdk.out/Payer.template.json -d infra/cdk.out/Member.template.json -d infra/cdk.out/OrgAccess.template.json -r policies/guard/wa-Security-Pillar.guard --show-summary fail -o single-line-summary"

[tasks.checkov]
description = "Checkov on the synthesized templates, Dockerfiles and workflows (run synth first)"
run = "uvx checkov==3.3.20 --config-file .checkov.yaml"

[tasks.dist]
description = "Build the release in dist/release/<label> (templates, assets, manifest). With `-- --publish`: push the image and upload to the provider account (MANGO_PROVIDER_ACCOUNT, MANGO_DIST_BUCKET, optional MANGO_PUBLISHER_ROLE_ARN)"
run = "python3 deployment/dist.py"

[tasks.provider-synth]
description = "Synthesize the provider account stack (runs cdk-nag); it is not part of a customer release"
run = "pnpm --filter @mango/infra exec cdk synth --app 'npx tsx bin/provider.ts' -o cdk.out.provider --quiet"

[tasks.pack]
description = "Build an MCP pack without signing it: mise run pack -- packs/aws-pricing dist/packs"
run = "deployment/build-pack.sh"

[tasks.audit]
description = "Known vulnerabilities in JS and Python dependencies"
run = [
  "pnpm audit",
  "mkdir -p .cache && uv export --all-packages --frozen --no-hashes --no-emit-workspace --format requirements-txt -o .cache/requirements-audit.txt",
  "uvx pip-audit==2.10.1 --strict -r .cache/requirements-audit.txt",
]

[tasks.secrets]
description = "Secret scan of the git history and of uncommitted changes, and real data by its shape (account ids, hosts, mail addresses) in the versioned files"
run = [
  "gitleaks git . --no-banner --redact",
  "gitleaks git . --pre-commit --no-banner --redact",
  "python3 deployment/check-real-data.py",
]

