[project]
name = "mango-textdoc"
version = "0.1.0"
description = "Canvas tools of Mango's agents: create, update and comment documents and code next to the chat, written only in Mango (AgentCore Gateway Lambda target, D124)"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1.43.104", "pydantic>=2.11", "mango-core"]

[tool.uv.sources]
mango-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_textdoc"]
