[project]
name = "mango-knowledge-retrieve"
version = "0.1.0"
description = "knowledge-retrieve tool of Mango's agents: searches the knowledge bases the asker may use (AgentCore Gateway Lambda target, D88)"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1.43.104", "pydantic>=2.11", "mango-core"]

[tool.uv.sources]
mango-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_knowledge_retrieve"]
