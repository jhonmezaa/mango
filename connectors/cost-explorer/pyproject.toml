[project]
name = "mango-cost-explorer"
version = "0.1.0"
description = "Cost Explorer connector for the Mango FinOps agent (AgentCore Gateway Lambda target)"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1.40", "pydantic>=2.11", "mango-aws", "mango-core"]

[tool.uv.sources]
mango-aws = { workspace = true }
mango-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_cost_explorer"]
