[project]
name = "mango-code-interpreter"
version = "0.1.0"
description = "Code tools of Mango's agents: runs the model's Python in the installation's Code Interpreter, one session per person and conversation (AgentCore Gateway Lambda target, D114)"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1.43.104", "pydantic>=2.11", "mango-core"]

[tool.uv.sources]
mango-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_code_interpreter"]
