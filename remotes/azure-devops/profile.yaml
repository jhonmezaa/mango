# Remote MCP profile of Azure DevOps (D93, D98 (14)). Format: mango_packs.remote.RemoteProfile.
# tool-schema.json is the server's `tools/list` with `X-MCP-Readonly: true`, captured live on
# 2026-10-27 (server AzureDevOps.Mcp 1.0.0.0, protocol 2025-06-18) and cut to these tools.
# How to refresh it: remotes/README.md.
schema_version: 1
id: azure-devops
# <date of the captured tool list>-<revision of Mango>
version: "2026.10.27-4"
name: Azure DevOps
operator: Microsoft
data_leaves_aws: true
endpoint:
  host: mcp.dev.azure.com
  path: "/{organization}"
link_hosts: [dev.azure.com, visualstudio.com]
link_org: {path_segment: 1, subdomain_of: visualstudio.com}
provider:
  vendor: MicrosoftOauth2
  display_name: Microsoft
  needs_tenant: true
  # Application id of the "Azure DevOps MCP" enterprise application (public, Microsoft docs).
  scopes: ["2a72489c-aab2-4b65-b93a-a91edccf33b8/.default", "offline_access"]
  permissions:
    - {resource: Azure DevOps MCP, permission: ".default (delegado, lectura)"}
    - {resource: Microsoft Entra, permission: offline_access}
# X-MCP-Tools carries the exact tools of the picked toolsets (D101), never X-MCP-Toolsets:
# search_code is in no named toolset value (live tools/list, 2026-10-29).
forced_headers:
  X-MCP-Readonly: "true"
  X-MCP-Tools: "{tools}"
# What an administrator picks; the server is only told the tools. `sensitivity`, `note` and
# `requirement` are optional: Mango draws the badge of a sensitivity, and shows the texts as
# they are written here (D98 (6)).
toolsets:
  - {id: core, label: Proyectos y equipos, always: true}
  - {id: wit, label: Work items}
  - {id: wiki, label: Wiki}
  - {id: pipelines, label: Pipelines}
  - id: search-code
    label: Búsqueda de código
    requirement: >-
      Necesita la extensión Code Search de Microsoft instalada en la organización. Sin ella,
      la búsqueda no encuentra nada y el agente responde que no hubo resultados.
  - id: repos
    label: Repositorios
    sensitivity: source_code
    note: >-
      El agente lee archivos, commits y pull requests de los repositorios a los que llega la
      cuenta de cada persona.
# Out of every toolset (TM-011): pipelines_artifact and wit_work_item_attachment.
probe: {tool: core_list_projects, arguments: {top: 1}}
tools:
  - {name: core_list_projects, toolset: core, access: read}
  - {name: core_list_project_teams, toolset: core, access: read}
  - {name: wit_work_item, toolset: wit, access: read}
  - {name: wit_query, toolset: wit, access: read}
  - {name: wit_backlog, toolset: wit, access: read}
  - {name: search_workitem, toolset: wit, access: read}
  - {name: wiki, toolset: wiki, access: read}
  - {name: search_wiki, toolset: wiki, access: read}
  - {name: pipelines_definition, toolset: pipelines, access: read}
  - {name: pipelines_run, toolset: pipelines, access: read}
  - {name: pipelines_build, toolset: pipelines, access: read}
  - {name: pipelines_build_log, toolset: pipelines, access: read}
  - {name: search_code, toolset: search-code, access: read}
  - {name: repo_repository, toolset: repos, access: read}
  - {name: repo_branch, toolset: repos, access: read}
  - {name: repo_file, toolset: repos, access: read}
  - {name: repo_search_commits, toolset: repos, access: read}
  - {name: repo_pull_request, toolset: repos, access: read}
  - {name: repo_pull_request_thread, toolset: repos, access: read}
tools_sha256: 550c0b4188e999639dbd73c5d674eef976b58ddcf1be683c6ba767b8076b45fb
max_result_chars: 65536
