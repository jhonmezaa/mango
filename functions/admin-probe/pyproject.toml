[project]
name = "mango-admin-probe"
version = "0.1.0"
description = "Read-only AdminProbe Lambda: organization OUs and payer connectivity check (D17)"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1.40", "mango-aws"]

[tool.uv.sources]
mango-aws = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_admin_probe"]
