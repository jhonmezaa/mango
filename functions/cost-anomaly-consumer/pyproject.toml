[project]
name = "mango-cost-anomaly-consumer"
version = "0.1.0"
description = "Lambda that validates cost anomaly events of the payer account and starts the runs of the automations subscribed to them (D79)"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1.43.104"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_cost_anomaly_consumer"]
