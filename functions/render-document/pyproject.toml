[project]
name = "mango-render-document"
version = "0.1.0"
description = "Lambda container that renders a Word, Excel or PowerPoint file of the chat to PDF and PNG pages with LibreOffice (D117)"
requires-python = ">=3.13,<3.14"
# LibreOffice and Poppler come from the image (Dockerfile), never from Python. boto3 talks to the
# chat files bucket; awslambdaric is the runtime interface of a container that is not built on
# an AWS Lambda base image.
dependencies = ["boto3>=1.43.104", "awslambdaric>=4.2.3,<5"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_render_document"]
