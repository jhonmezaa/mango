[project]
name = "mango-task-report"
version = "0.1.0"
description = "Lambda that draws the downloadable PDF of a task run from the data its agent handed over (D86, D87)"
requires-python = ">=3.13,<3.14"
# ReportLab draws the PDF by code: no HTML, CSS or browser reaches the model's text (D87 (2)).
# Pillow comes with ReportLab; the reports draw no images, so it never decodes anything here. Its
# arm64 wheels are manylinux_2_28 only: the function is bundled for that tag
# (`infra/lib/constructs/task-reports.ts`).
dependencies = ["boto3>=1.43.104", "mango-core[agents]", "reportlab>=5.0.1,<6"]

[tool.uv.sources]
mango-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_task_report"]
