[project]
name = "mango-task-auth"
version = "0.1.0"
description = "Cognito custom auth challenge of task runs: issues an owner's token only to mango-api (D78)"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1.40", "mango-core"]

[tool.uv.sources]
mango-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_task_auth"]
