[project]
name = "mango-eval-judge"
version = "0.1.0"
description = "Evaluator of the evals (D110): reads the evals harness traces, scores them with AgentCore Evaluations and runs the canary"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1.43.104", "mango-core[agents]"]

[tool.uv.sources]
mango-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_eval_judge"]
