[project]
name = "mango-gateway-interceptor"
version = "0.1.0"
description = "AgentCore Gateway REQUEST interceptor: injects the verified caller token into tool calls (D13)"
requires-python = ">=3.13,<3.14"
dependencies = ["mango-core"]

[tool.uv.sources]
mango-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_gateway_interceptor"]
