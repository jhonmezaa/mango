[project]
name = "mango-knowledge-sync"
version = "0.1.0"
description = "Steps of the KnowledgeSync state machine: ingests, verifies and deletes the documents of the knowledge bases (D88)"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1.43.104", "mango-core"]

[tool.uv.sources]
mango-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_knowledge_sync"]
