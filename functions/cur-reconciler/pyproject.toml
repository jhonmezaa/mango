[project]
name = "mango-cur-reconciler"
version = "0.1.0"
description = "Daily read-only Lambda that compares Mango's per-agent Bedrock spend with the CUR 2.0 bill (D104)"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1.43.104", "mango-core"]

[tool.uv.sources]
mango-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_cur_reconciler"]
