[project]
name = "mango-api"
version = "0.1.0"
description = "Mango control plane API: chat BFF (SSE), authorization, budgets, conversations, audit"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.120",
  "uvicorn>=0.37",
  "boto3>=1.43.100",
  "pydantic>=2.11",
  "mango-core[agents]",
  "mango-packs",
]

[tool.uv.sources]
mango-core = { workspace = true }
mango-packs = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_api"]
