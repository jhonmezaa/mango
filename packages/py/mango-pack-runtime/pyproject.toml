[project]
name = "mango-pack-runtime"
version = "0.1.0"
description = "Common entry point of MCP packs over account data: verified caller identity and per-call broker credentials (D37)"
requires-python = ">=3.13,<3.14"
dependencies = ["mango-aws", "boto3>=1.40", "cryptography>=46"]

[tool.uv.sources]
mango-aws = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_pack_runtime"]
