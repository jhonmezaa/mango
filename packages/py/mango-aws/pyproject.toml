[project]
name = "mango-aws"
version = "0.1.0"
description = "Cross-account access for Mango: broker role chaining, per-call session policies and SourceIdentity (D10)"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1.40"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_aws"]
