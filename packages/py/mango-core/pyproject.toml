[project]
name = "mango-core"
version = "0.1.0"
description = "Shared Mango domain primitives: identity claims and Cognito access-token verification"
requires-python = ">=3.13,<3.14"
dependencies = ["pyjwt[crypto]>=2.10"]

[project.optional-dependencies]
# `mango_core.agents` (agent definitions). An extra, so Lambdas that only verify identity
# (gateway interceptor) do not bundle pydantic.
agents = ["pydantic>=2.11"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mango_core"]
